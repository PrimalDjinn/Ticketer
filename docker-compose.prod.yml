# Production: pulls the published image. Everything the app writes (SQLite database + uploaded files) lives on the
# `ticketer_data` volume, so containers can be replaced freely; back that volume up.
#
#   export NUXT_APP_SECRET=$(openssl rand -base64 32)                            # see .env.example
#   docker compose -f docker-compose.prod.yml up -d
#   docker compose -f docker-compose.prod.yml --profile tunnel up -d             # also expose it via Cloudflare Tunnel
x-runtime-secrets: &runtime-secrets
  secrets:
    - nuxt_app_secret
    - nuxt_mail_smtp_url
    - nuxt_admin_password

services:
  ticketer:
    # Published by CI from PrimalDjinn/Ticketer; set TICKETER_IMAGE to run a fork's image or a pinned sha tag.
    image: ${TICKETER_IMAGE:-ghcr.io/primaldjinn/ticketer:latest}
    pull_policy: always
    restart: unless-stopped
    <<: *runtime-secrets
    environment:
      PORT: 3000
      NUXT_MAIL_FROM: ${NUXT_MAIL_FROM:-}
      # First admin, created on first start if no account has this email (or run: exec ticketer node scripts/admin.mjs)
      NUXT_ADMIN_EMAIL: ${NUXT_ADMIN_EMAIL:-}
    ports:
      - "${TICKETER_BIND:-127.0.0.1}:${TICKETER_PORT:-3000}:3000"
    volumes:
      - ticketer_data:/app/.data
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  # Optional: publish the app without opening inbound ports. The tunnel's public hostname should point at
  # http://ticketer:3000. WebSockets work through tunnels as-is.
  cloudflared:
    profiles: [tunnel]
    image: cloudflare/cloudflared:latest
    pull_policy: always
    restart: unless-stopped
    command: tunnel --no-autoupdate --metrics 0.0.0.0:2000 run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?Set CLOUDFLARE_TUNNEL_TOKEN to use the tunnel profile}
    depends_on:
      ticketer:
        condition: service_healthy

volumes:
  ticketer_data:

secrets:
  nuxt_app_secret:
    environment: NUXT_APP_SECRET
  nuxt_mail_smtp_url:
    environment: NUXT_MAIL_SMTP_URL
  nuxt_admin_password:
    environment: NUXT_ADMIN_PASSWORD
