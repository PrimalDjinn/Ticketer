services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    command: /bin/bash -c "while true; do sleep 1; done"
    volumes:
      - ..:/workspaces/ticketer
      # Mount SSH and Git config for Git authentication
      - ${HOME}/.ssh:/home/coder/.ssh
      - ${HOME}/.gitconfig:/home/coder/.gitconfig
      # Keep the pnpm store across rebuilds
      - pnpm-store:/home/coder/.local/share/pnpm
    networks:
      - ticketer-dev
    healthcheck:
      test: ["CMD", "ps", "aux"]
      interval: 5s
      timeout: 2s
      retries: 3
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  pnpm-store:

networks:
  ticketer-dev:
    driver: bridge
