name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: Typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - name: Build (Node)
        run: pnpm build:node
      - name: Build (Cloudflare)
        run: pnpm build:cloudflare

  image:
    name: Docker image
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Image name
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/ticketer
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=ref,event=pr
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Cloudflare
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    # Every deployment (each fork) brings its own Cloudflare account. Without these settings the job ends early and
    # successfully, so upstream CI stays green.
    #   secrets: CLOUDFLARE_API_TOKEN, NUXT_APP_SECRET
    #   vars:    CLOUDFLARE_ACCOUNT_ID, CF_D1_DATABASE_ID, CF_R2_BUCKET (optional), CF_WORKER_NAME (optional),
    #            NUXT_MAIL_FROM (optional)
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CF_D1_DATABASE_ID: ${{ vars.CF_D1_DATABASE_ID }}
      CF_R2_BUCKET: ${{ vars.CF_R2_BUCKET }}
      CF_WORKER_NAME: ${{ vars.CF_WORKER_NAME }}
      NUXT_APP_SECRET: ${{ secrets.NUXT_APP_SECRET }}
      NUXT_MAIL_FROM: ${{ vars.NUXT_MAIL_FROM }}
    steps:
      - name: Check deployment settings
        id: settings
        run: |
          missing=""
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID CF_D1_DATABASE_ID NUXT_APP_SECRET; do
            eval "value=\${$name:-}"
            [ -n "$value" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::notice title=Cloudflare deploy skipped::Not configured for this repository (missing:$missing)."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.settings.outputs.enabled == 'true'
        uses: actions/checkout@v5
      - if: steps.settings.outputs.enabled == 'true'
        uses: pnpm/action-setup@v4
      - if: steps.settings.outputs.enabled == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - if: steps.settings.outputs.enabled == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build
        if: steps.settings.outputs.enabled == 'true'
        run: pnpm build:cloudflare

      - name: Apply D1 migrations
        if: steps.settings.outputs.enabled == 'true'
        run: pnpm exec wrangler d1 migrations apply DB --remote --config .output/server/wrangler.json

      - name: Deploy worker
        if: steps.settings.outputs.enabled == 'true'
        run: |
          secrets_file="$(mktemp)"
          trap 'rm -f "$secrets_file"' EXIT
          node -e 'require("fs").writeFileSync(process.argv[1], JSON.stringify({ NUXT_APP_SECRET: process.env.NUXT_APP_SECRET }))' "$secrets_file"
          args=(--config .output/server/wrangler.json --secrets-file "$secrets_file")
          if [ -n "$NUXT_MAIL_FROM" ]; then args+=(--var "NUXT_MAIL_FROM:$NUXT_MAIL_FROM"); fi
          pnpm exec wrangler deploy "${args[@]}"
